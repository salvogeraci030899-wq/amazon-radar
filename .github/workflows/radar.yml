name: Amazon Radar

on:
  schedule:
    - cron: "7,37 * * * *"   # ogni 30 minuti
  workflow_dispatch:          # pulsante "Run workflow" per provarlo subito

permissions:
  contents: write

concurrency:
  group: amazon-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Controlla prezzi e comandi
        run: python bot.py
        env:
          KEEPA_KEY: ${{ secrets.KEEPA_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Salva lista e stato
        run: |
          git config user.name "amazon-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watchlist.json state.json
          git diff --cached --quiet || (git commit -m "radar: aggiorna stato" && git push)
